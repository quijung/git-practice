name: Hash Functions Example
on: workflow_dispatch
jobs:
  hash-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Create Sample File
        run: |
          echo "Hello GitHub Actions" > sample.txt

      - uses: actions/checkout@v5
      - name: Hash Test
        env:
          RESULT_HASH: "${{ hashFiles('sample.txt') }}"
          RESULT_ALL: "${{ hashFiles('*.txt') }}"
          RESULT_MISSING: "${{ hashFiles('missing.txt') }}"
        run: printenv | grep '^RESULT_' | sort
      
      - name: GitHub File Hash
        env:
          RESULT_YAML: "${{ hashFiles('.github/workflows/*.yaml') }}"
        run: printenv | grep '^RESULT_'