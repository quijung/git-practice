name: Literal Example
on: workflow_dispatch
jobs:
  Literal:
    runs-on: ubuntu-latest
    steps:
      - name: Literal test
        run:  |
          echo "Boolean: ${{ true }}"
          echo "Integer: ${{ 100 }}"
          echo "Float: ${{3.14}}"
          echo "String: ${{ 'Hello Github' }}"
          echo "String: String can also be written in this form"
          echo "Null: ${{ null }}"